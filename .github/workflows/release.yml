name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests before release
        run: GOWORK=off go test ./internal/... ./cmd/... ./pkg/...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          awk -v tag="## [${VERSION}]" '
            index($0, tag) == 1 { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          echo "----- release notes for ${VERSION} -----"
          cat /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "ERROR: no CHANGELOG section found for ${VERSION}" >&2
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          # --release-notes makes GoReleaser use our curated CHANGELOG section as
          # the release body verbatim, instead of auto-generating from commit
          # messages (which would overwrite it).
          args: release --clean --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

  # ── Language / combo / full Docker images ─────────────────────────────────
  # Each image builds on its own runner in parallel. Manifests are created
  # after all images in a group complete.
  docker-images:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Per-language images (Dockerfile.lang)
          - tag: go
            dockerfile: docker/Dockerfile.lang
            platforms: linux/amd64,linux/arm64
            build_args: |
              LANG=go
              LSP_PACKAGE=golang.org/x/tools/gopls@latest
              PACKAGE_MGR=go
              LSP_BINARY=gopls
          - tag: typescript
            dockerfile: docker/Dockerfile.lang
            platforms: linux/amd64,linux/arm64
            build_args: |
              LANG=typescript
              LSP_PACKAGE=typescript-language-server@6.0.3 typescript@6.0.3
              PACKAGE_MGR=npm
              LSP_BINARY=typescript-language-server
          - tag: python
            dockerfile: docker/Dockerfile.lang
            platforms: linux/amd64,linux/arm64
            build_args: |
              LANG=python
              LSP_PACKAGE=pyright
              PACKAGE_MGR=npm
              LSP_BINARY=pyright-langserver
          - tag: ruby
            dockerfile: docker/Dockerfile.lang
            platforms: linux/amd64,linux/arm64
            build_args: |
              LANG=ruby
              LSP_PACKAGE=solargraph
              PACKAGE_MGR=gem
              LSP_BINARY=solargraph
          - tag: cpp
            dockerfile: docker/Dockerfile.lang
            platforms: linux/amd64,linux/arm64
            build_args: |
              LANG=cpp
              LSP_PACKAGE=clangd
              PACKAGE_MGR=apt
              LSP_BINARY=clangd
          - tag: php
            dockerfile: docker/Dockerfile.lang
            platforms: linux/amd64,linux/arm64
            build_args: |
              LANG=php
              LSP_PACKAGE=intelephense
              PACKAGE_MGR=npm
              LSP_BINARY=intelephense
          # Combo images (Dockerfile.combo)
          - tag: web
            dockerfile: docker/Dockerfile.combo
            platforms: linux/amd64,linux/arm64
            build_args: |
              NPM_PACKAGES=typescript-language-server@6.0.3 typescript@6.0.3 pyright
              GO_PACKAGES=
          - tag: backend
            dockerfile: docker/Dockerfile.combo
            platforms: linux/amd64,linux/arm64
            build_args: |
              NPM_PACKAGES=pyright
              GO_PACKAGES=golang.org/x/tools/gopls@latest
          - tag: fullstack
            dockerfile: docker/Dockerfile.combo
            platforms: linux/amd64,linux/arm64
            build_args: |
              NPM_PACKAGES=typescript-language-server@6.0.3 typescript@6.0.3 pyright
              GO_PACKAGES=golang.org/x/tools/gopls@latest
          # Full image (Dockerfile.full)
          - tag: full
            dockerfile: docker/Dockerfile.full
            platforms: linux/amd64,linux/arm64
            build_args: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          CGO_ENABLED=0 GOWORK=off go build \
            -ldflags "-s -w -X main.Version=${VERSION}" \
            -o agent-lsp ./cmd/agent-lsp

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/blackwell-systems/agent-lsp:${{ matrix.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/agent-lsp:${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

  winget:
    name: Publish to winget
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: BlackwellSystems.agent-lsp
          installers-regex: 'windows.*\.zip$'
          max-versions-to-keep: 5
          fork-user: blackwell-systems
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    # OIDC trusted publishing: GitHub mints a short-lived OIDC token that npm
    # exchanges for publish rights. No NPM_TOKEN secret; nothing to rotate or
    # expire. Requires a trusted publisher configured per package on npmjs.com
    # (org blackwell-systems, repo agent-lsp, workflow release.yml).
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; the Node 22 image ships older.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Publish npm packages (OIDC trusted publishing)
        run: bash scripts/npm-publish.sh "${{ github.ref_name }}"

  pypi-publish:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install wheel setuptools twine

      - name: Build and publish wheels
        run: |
          bash scripts/pypi-build-wheels.sh "${{ github.ref_name }}"
          twine upload pypi/dist/*.whl
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  mcp-registry-publish:
    needs: npm-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          # Pinned with a checksum, not releases/latest, so a new publisher release
          # cannot change release behavior unannounced. Bump both together.
          MCP_PUBLISHER_VERSION=v1.8.1
          MCP_PUBLISHER_SHA256=a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" -o /tmp/mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_SHA256}  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tar.gz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Update server.json version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          node -e "
            const fs = require('fs');
            const s = JSON.parse(fs.readFileSync('server.json'));
            s.version = '${VERSION}';
            s.packages[0].version = '${VERSION}';
            fs.writeFileSync('server.json', JSON.stringify(s, null, 2) + '\n');
          "

      # The MCP Registry validates that the npm package version exists, and a
      # just-published npm version can take minutes to become visible. Publishing
      # immediately failed with "version ... was not found (status: 404)" on most
      # releases and needed a manual re-run, so wait for npm to serve it first.
      - name: Wait for npm to serve this version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          URL="https://registry.npmjs.org/@blackwell-systems%2Fagent-lsp/${VERSION}"
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null "$URL"; then
              echo "npm serves @blackwell-systems/agent-lsp@${VERSION}"
              exit 0
            fi
            echo "attempt $i: ${VERSION} not visible on npm yet; retrying in 15s"
            sleep 15
          done
          echo "::error::npm did not serve ${VERSION} within 10 minutes"
          exit 1

      - name: Login to MCP Registry (GitHub OIDC)
        run: mcp-publisher login github-oidc

      # npm can answer our request before the registry's own validator sees the
      # version (different caches), so retry the publish a few times as well.
      - name: Publish to MCP Registry
        run: |
          for i in 1 2 3 4 5; do
            if mcp-publisher publish; then
              exit 0
            fi
            echo "publish attempt $i failed; retrying in 30s"
            sleep 30
          done
          exit 1
