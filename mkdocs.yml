site_name: agent-lsp
site_url: https://agent-lsp.com
site_description: LSP-powered code intelligence for AI agents
repo_url: https://github.com/blackwell-systems/agent-lsp
repo_name: blackwell-systems/agent-lsp
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - MCP Clients: getting-started/mcp-clients.md
    - Troubleshooting: getting-started/troubleshooting.md
  - Guide:
    - Common Workflows: guide/common-workflows.md
    - Skills: guide/skills.md
    - Speculative Execution: guide/speculative-execution.md
    - Phase Enforcement: guide/phase-enforcement.md
    - Token Savings: guide/token-savings.md
    - GCF Integration: guide/gcf-integration.md
  - Reference:
    - Tools: reference/tools.md
    - Language Support: reference/language-support.md
    - LSP Conformance: reference/lsp-conformance.md
    - Environment Variables: reference/env-vars.md
  - Architecture:
    - Overview: architecture/architecture.md
    - Distribution: architecture/distribution.md
    - CI Notes: architecture/ci-notes.md
    - Agent Evaluations: architecture/agent-evaluations.md
    - Features: architecture/FEATURES.md
    - Roadmap: architecture/roadmap.md
  - Adopters: adopters.md
  - Changelog: changelog.md
